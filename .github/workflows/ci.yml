name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: npm ci
      - run: python -m pip install --upgrade pip setuptools==83.0.0
      - run: python -m pip install -e ".[dev]"
      - name: Frontend quality
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run build
      - name: Public demo credential gate
        run: python scripts/check_demo_credentials.py --build-dir dist
      - name: Backend quality
        run: |
          python -m ruff check services scripts evals
          python -m mypy services/api/lessonforge
          python -m pytest
      - name: Evaluation suite
        run: python evals/run_eval.py
      - name: Dependency audit
        run: |
          npm audit --audit-level=critical
          python -m pip_audit --local --skip-editable
