name: lessonforge-tw
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: lessonforge
      POSTGRES_USER: lessonforge
      POSTGRES_PASSWORD: lessonforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lessonforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://lessonforge:lessonforge@postgres:5432/lessonforge
      REDIS_URL: redis://redis:6379/0
      LLM_BASE_URL: http://host.docker.internal:11434
      IN_PROCESS_JOBS: "false"
    ports: ["8000:8000"]
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    command: python -m lessonforge.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://lessonforge:lessonforge@postgres:5432/lessonforge
      REDIS_URL: redis://redis:6379/0
      LLM_BASE_URL: http://host.docker.internal:11434
      IN_PROCESS_JOBS: "false"
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    ports: ["11434:11434"]

volumes:
  postgres_data:
  redis_data:
  ollama_data:
