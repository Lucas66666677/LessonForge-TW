[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lessonforge-tw"
version = "0.1.0"
description = "Local-first AI lesson material production for Taiwanese English tutoring centers"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "SQLAlchemy[asyncio]==2.0.51",
  "alembic==1.19.0",
  "asyncpg==0.31.0",
  "aiosqlite==0.22.1",
  "pgvector==0.5.0",
  "redis==8.1.0",
  "PyJWT==2.13.0",
  "argon2-cffi==25.1.0",
  "python-multipart==0.0.32",
  "email-validator==2.3.0",
  "httpx==0.28.1",
  "pypdf==6.15.0",
  "python-docx==1.2.0",
  "jinja2==3.1.6",
  "playwright==1.62.0",
  "reportlab==5.0.0",
  "slowapi==0.1.10",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.2",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "types-PyJWT==1.7.1",
]

[tool.setuptools.packages.find]
where = ["services/api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services/api/tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["services/api", "services/worker", "scripts", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "S105", "B008", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["lessonforge"]
mypy_path = "services/api"

[tool.coverage.run]
source = ["services/api/lessonforge"]
branch = true
