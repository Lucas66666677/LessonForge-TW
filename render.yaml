services:
  - type: web
    name: lessonforge-tw-api-lucas
    runtime: docker
    repo: https://github.com/Lucas66666677/LessonForge-TW
    branch: main
    dockerfilePath: ./infra/api.Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lessonforge-tw-db-lucas
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: IN_PROCESS_JOBS
        value: "true"
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_PROVIDER
        value: disabled
      - key: LOG_RAW_AI_CONTENT
        value: "false"
      - key: UPLOAD_DIR
        value: /tmp/lessonforge/uploads
      - key: EXPORT_DIR
        value: /tmp/lessonforge/exports

databases:
  - name: lessonforge-tw-db-lucas
    databaseName: lessonforge
    user: lessonforge
    plan: free
    region: singapore
